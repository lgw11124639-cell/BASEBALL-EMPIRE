<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투구폼 구분동작 · BASEBALL EMPIRE</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#173345;font-family:system-ui,-apple-system,sans-serif}main{max-width:1360px;margin:auto;padding:28px 20px 60px}header small{font-size:10px;letter-spacing:.16em;color:#667d8f}h1{font-size:28px;margin:10px 0}header p{color:#526a7b;line-height:1.6;margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav a{padding:10px 16px;border:1px solid #cad6df;border-radius:24px;text-decoration:none;color:#294d62;background:white;font-size:14px}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:14px 18px;background:white;border:1px solid #d8e1e8;border-radius:14px;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.blue{background:#267bd4}.red{background:#d44749}section{scroll-margin-top:16px;margin:26px 0 40px;background:white;border:1px solid #d5e0e7;border-radius:20px;padding:22px}section h2{margin:0;font-size:22px}section>p{margin:8px 0 18px;color:#617789;font-size:14px}.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 10px}figure{margin:0;min-width:0}.pose{position:relative;overflow:hidden;aspect-ratio:355/444;background:#dedee2;border-radius:10px}.pose img{display:block;position:absolute;max-width:none}.pose .sheet{width:500%;height:200%;object-fit:fill}.pose .single{width:100%;height:100%;object-fit:fill}figcaption{display:flex;gap:8px;align-items:center;font-size:12px;min-height:42px;padding:8px 2px;color:#526b7c}figcaption b{color:#214e67;font-size:13px}.coil .pose{outline:2px solid #3b7f9d;outline-offset:-2px}.coil figcaption{color:#205970;font-weight:600}footer{font-size:13px;color:#61778a;line-height:1.7}footer a{color:#2f6e8f}@media(max-width:640px){main{padding:20px 12px 40px}h1{font-size:23px}section{padding:14px;border-radius:16px}.steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}nav a{font-size:12px;padding:9px 12px}.legend{font-size:12px;gap:10px}figcaption{font-size:11px}}
</style></head><body><main><header><small>BASEBALL EMPIRE · PITCHING MOTION</small><h1>투구폼별 10단계 구분동작</h1><p>우투 기준. 2·3번은 같은 오른발 지지와 오른쪽 비틀기을 유지하며, 3번에서 왼무릎을 더 높입니다.</p></header><nav><a href="#overhand">오버핸드</a><a href="#threequarter">쓰리쿼터</a><a href="#sidearm">사이드암</a><a href="#submarine">언더핸드</a></nav><div class="legend"><span><i class="dot blue"></i>공을 던지는 오른손목</span><span><i class="dot red"></i>들고 내딛는 왼무릎</span><span>2·3번 테두리: 수정한 비틀기 동작</span></div><div id="boards"></div><footer>폼별 구분동작 시안 · 경기 중계 적용 전 검토용<br><a href="index.html">BASEBALL EMPIRE로 돌아가기</a></footer></main><script>
const styles=[['overhand','오버핸드','오른팔이 어깨 위로 올라가 머리 위에서 릴리스'],['threequarter','쓰리쿼터','오른팔이 어깨 위 대각선 슬롯에서 릴리스'],['sidearm','사이드암','오른팔이 어깨 높이의 수평 슬롯에서 릴리스'],['submarine','언더핸드','상체를 깊게 숙이고 오른손을 무릎 높이로 낮춰 릴리스']],labels=['준비','초기 들기 · 오른쪽 비틀기','최고점 · 오른쪽 비틀기','스트라이드 · 손 분리','착지 · 코킹','릴리스','초기 팔로스루','팔로스루','감속','균형 회복'];
document.querySelector('#boards').innerHTML=styles.map(([key,name,desc])=>`<section id="${key}" aria-label="${name} 10단계"><h2>${name}</h2><p>${desc} · <a href="assets/broadcast/form-review/${key}-board.webp" target="_blank" rel="noopener">전체 이미지 보기</a></p><div class="steps">${labels.map((label,i)=>`<figure class="${i===1||i===2?'coil':''}" data-step="${i+1}"><div class="pose">${i===1||i===2?`<img class="single" src="assets/broadcast/form-review/coil-${i+1}.webp" alt="${i+1}번 ${label}">`:`<img class="single" src="assets/broadcast/form-review/${key}-step-${i+1}.webp" alt="${i+1}번 ${label}">`}</div><figcaption><b>${String(i+1).padStart(2,'0')}</b>${label}</figcaption></figure>`).join('')}</div></section>`).join('');
</script></body></html>
