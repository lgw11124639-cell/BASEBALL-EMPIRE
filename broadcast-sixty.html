<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60컷 투구 동작</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#173c4d;font:16px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:20px}h1{font-size:25px;margin:12px 0}p{line-height:1.6}button,select,input{font:inherit}button,select{padding:11px;border:1px solid #c5d5dc;border-radius:10px;background:white;color:inherit}button{cursor:pointer}#play{background:#2d7376;color:white;min-width:125px}button:disabled{opacity:.5}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:white;border:1px solid #d5e1e6;padding:14px;border-radius:14px}label{display:flex;align-items:center;gap:7px}#seek{flex:1;min-width:140px}#step{min-width:65px;font-variant-numeric:tabular-nums}.scene{position:relative;aspect-ratio:18/13;margin-top:14px;border-radius:16px;overflow:hidden;background:#123946 url('assets/broadcast/pitch-camera-right.webp') center/cover}.scene[data-hand=left]{background-image:url('assets/broadcast/pitch-camera-left.webp')}.scene[data-background=none]{background:repeating-conic-gradient(#d6e1e5 0% 25%,#f5f9fa 0% 50%) 0/24px 24px}.scene canvas{display:block;width:100%;height:100%}#status{min-height:26px;margin-bottom:8px}footer{margin-top:20px;display:flex;gap:15px;flex-wrap:wrap}a{color:#286e79}@media(max-width:600px){main{padding:14px}.controls{gap:8px;padding:11px}button,select{padding:10px}h1{font-size:23px}#seek{flex-basis:60%}}
</style></head><body><main><small>BASEBALL EMPIRE · 투구 동작 시안</small><h1>그 외형 그대로, 60컷 투구</h1><p>보라색 유니폼의 우완 투구 시안입니다. 같은 선수 외형으로 만든 60개의 동작을 2초 동안 재생합니다.</p><div class="controls"><button id="previous" aria-label="이전 컷">◀</button><button id="play" disabled>▶ 재생</button><button id="next" aria-label="다음 컷">▶</button><select id="hand" aria-label="투구 손"><option value="right">우투</option><option value="left">좌투</option></select><label>속도<select id="speed"><option value=".25">0.25배</option><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label><label><input id="background" type="checkbox" checked>경기장</label><input id="seek" aria-label="구분 동작" type="range" min="0" max="59" step="1" value="0"><output id="step">1 / 60</output></div><p id="status" role="status">이미지를 불러오는 중…</p><div class="scene"><canvas id="sixty-canvas" aria-label="60컷 투구 애니메이션"></canvas></div><p>준비 자세는 발을 모으고, 왼발을 들어 앞으로 착지합니다. 투구 뒤에는 오른쪽 축다리가 앞으로 따라옵니다.</p><footer><a href="index.html?v=20261107-sixty83">게임으로 돌아가기</a><a href="assets/broadcast/motion/pitcher-sixty/source-1.png">1–20컷 원본</a><a href="assets/broadcast/motion/pitcher-sixty/source-2.png">21–40컷 원본</a><a href="assets/broadcast/motion/pitcher-sixty/source-3.png">41–60컷 원본</a></footer></main><script type="module" src="broadcast-sixty-player.mjs?v=20261107-sixty83"></script></body></html>
