name: One-time cleanup of the completed Pages release
on:
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  finish-stale-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const id = 7470742159;
            const expected = '9ade569ab79755478bbe23eddfd4048f8a8b17d8';
            const deployment = await github.rest.repos.getDeployment({...context.repo, deployment_id: id});
            if (deployment.data.sha !== expected || deployment.data.environment !== 'github-pages') {
              throw new Error('The fixed deployment does not match the approved older release');
            }
            const statuses = await github.rest.repos.listDeploymentStatuses({...context.repo, deployment_id: id});
            if (statuses.data[0]?.state !== 'success') {
              throw new Error('Only this already completed deployment may be marked inactive');
            }
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: id,
              state: 'inactive',
              environment: 'github-pages',
              description: 'Completed older release; retiring stale deployment status'
            });
