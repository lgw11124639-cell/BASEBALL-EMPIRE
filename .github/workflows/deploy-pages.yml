name: Deploy BASEBALL EMPIRE to Pages
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.json'
      - '*.webmanifest'
      - 'vendor/**'
      - 'audio/**'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages configuration
        uses: actions/github-script@v7
        with:
          script: |
            const site = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            if (site.data.build_type !== 'workflow') {
              throw new Error('Repository owner must select GitHub Actions in Settings > Pages > Source before deployment');
            }
      - uses: actions/configure-pages@v5
      - name: Assemble public application files
        run: |
          mkdir -p _site
          cp broadcast-fixed.html broadcast-fixed-review.mjs broadcast-fixed-rig.mjs broadcast-fixed-motion.mjs broadcast-fixed-gear.mjs broadcast-game-actor.mjs broadcast-review-zone.mjs broadcast-smooth-batter.mjs broadcast-smooth.html broadcast-smooth-player.mjs broadcast-sixty.html broadcast-sixty-player.mjs broadcast-uniforms.html broadcast-uniform-review.mjs broadcast-form-player.mjs broadcast-forms.html broadcast-actors.mjs broadcast-batter.mjs broadcast-labels.mjs broadcast-pose.mjs broadcast-uniforms.mjs app.js native-save.js kpbl-investigation-policy.js cloud-only.js cloud-save.js server-day-client.js server-save-client.js index.html server-home-preview.html server-home-original-preview.html manifest.webmanifest sw.js ui.css update.js version.json _site/
          cp -R vendor _site/vendor
          cp -R audio _site/audio
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
