name: One-time cancellation of approved Pages deployment 9ade569
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
              ...context.repo,
              pages_deployment_id: '9ade569ab79755478bbe23eddfd4048f8a8b17d8'
            });
