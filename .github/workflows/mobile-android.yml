name: Build offline Android trial
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify with an ephemeral fixture certificate; never publish this APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci --no-audit --no-fund
      - run: npm run mobile:test
      - run: npm run mobile:android
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config mobile/playwright.config.mjs
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
      - name: Prepare maintained signing
        env:
          BE_VERIFY_ONLY: ${{ inputs.verify_only }}
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        run: node scripts/prepare-ci-signing.mjs
      - name: Build previous-version upgrade fixture
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PbeVersionCode=4 -PbeVersionName=upgrade-baseline
          cp app/build/outputs/apk/debug/app-debug.apk ../test-baseline.apk
          ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2
          script: node scripts/test-android-emulator.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: test-results/android/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.verify_only }}
        with:
          name: baseball-empire-offline-trial-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
