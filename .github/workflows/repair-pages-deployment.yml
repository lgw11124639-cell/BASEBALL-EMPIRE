name: One-time recovery of blocked Pages deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-one-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the approved blocked deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pages_deployment_id: 'cbf1d50343378e2f7ffc07beceb9cf6b2e3e636e'
            });
            core.info('Cancelled the single approved older deployment');
