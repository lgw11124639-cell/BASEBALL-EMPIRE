name: BASEBALL EMPIRE Release Gate
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and record regression tests
        run: |
          node tests/release-smoke.test.js
          node tests/velocity-balance.test.js
          node tests/velocity-longrun.test.js
