name: Baseball regression checks
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/baseball-tests.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: All regression files including KPBL governance and scope
        run: node tests/run-all.cjs
      - name: Actual two-season 1440-game KPBL audit
        run: KPBL_AUDIT_REPORT=kpbl-1440-report.json node tests/audit-kpbl-seasons.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: kpbl-season-audit
          path: kpbl-1440-report.json
