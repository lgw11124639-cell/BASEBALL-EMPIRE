name: Baseball regression checks
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/baseball-tests.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: International record isolation
        run: node tests/international-record-isolation.test.cjs
      - name: International schedule
        run: node tests/international-schedule.test.cjs
      - name: National team return
        run: node tests/national-return.test.cjs
      - name: International tournament progression
        run: node tests/international-tournament-flow.test.cjs
