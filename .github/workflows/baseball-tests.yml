name: Baseball regression checks
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/baseball-tests.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: International record isolation
        run: node tests/international-record-isolation.test.cjs
      - name: International schedule
        run: node tests/international-schedule.test.cjs
      - name: National team return
        run: node tests/national-return.test.cjs
      - name: International tournament progression
        run: node tests/international-tournament-flow.test.cjs
      - name: Thirty-year calendar progression
        run: node tests/long-calendar.test.cjs
      - name: Thirty-year season transitions
        run: node tests/season-transition.test.cjs
      - name: Season snapshot history isolation
        run: node tests/season-snapshot.test.cjs
      - name: Player history and career total rendering
        run: node tests/player-history-render.test.cjs
      - name: Career records across transfers
        run: node tests/career-transfer-history.test.cjs
      - name: Offseason retirement archive
        run: node tests/offseason-retirement.test.cjs
      - name: Offseason FA transfer and settlement
        run: node tests/offseason-fa-transfer.test.cjs
      - name: FA compensation failure recovery
        run: node tests/fa-compensation-failure.test.cjs
      - name: FA rollback integration
        run: node tests/fa-rollback-integration.test.cjs
      - name: Thirty-year real league scheduling
        run: node tests/long-league-schedule.test.cjs
      - name: Thirty-year innings controller stress
        run: node tests/long-innings-controller.test.cjs
      - name: Season batting and pitching box-score totals
        run: node tests/season-boxscore-aggregation.test.cjs
      - name: Real plate appearance and inning accounting
        run: node tests/plate-appearance-engine.test.cjs
      - name: Comprehensive plate appearance scoring scenarios
        run: node tests/plate-appearance-scenarios.test.cjs
      - name: Comprehensive game engine regression
        run: node tests/comprehensive-game-engine.test.cjs
      - name: Performance-based retirement regression
        run: node tests/retirement-probability.test.cjs
      - name: Unsigned released player retirement regression
        run: node tests/unsigned-retirement.test.cjs
      - name: Broadcast-independent production engine
        run: node tests/engine-event-independence.test.cjs
      - name: Actual 720-game league balance audit
        run: node tests/league-balance.test.cjs
      - name: Continuous extra-base hit regression
        run: node tests/extra-base-hit.test.cjs
      - name: Hit-by-pitch and dead-ball regression
        run: node tests/hit-by-pitch.test.cjs
      - name: Contract types, guaranteed salary and expiry
        run: node tests/player-contracts.test.cjs
      - name: Late FA settlement and offseason retry
        run: node tests/fa-late-settlement.test.cjs
      - name: Separate foreign and Asian-quota renewals
        run: node tests/foreign-contracts.test.cjs
      - name: FA valuations and player refusal decisions
        run: node tests/fa-negotiation.test.cjs
      - name: Ten-club FA negotiation and cash conservation
        run: node tests/fa-market-simulation.test.cjs
