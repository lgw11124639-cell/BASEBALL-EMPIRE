<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투구 모션 · 고정 비율 시안</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#193c4b;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6;margin:8px 0 20px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button,select{font:inherit;padding:10px 14px;border:1px solid #bacbd2;border-radius:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#2f756d;color:white;border:0}.stage{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(#e1e7ed,#c6d0d9);aspect-ratio:720/520}.stage:before{content:"";position:absolute;inset:0;background:url(./assets/broadcast/motion/pitcher-smooth/pitch-deep.webp) center/100% 100%;transform:scaleX(-1)}.stage.left:before{transform:none}.stage canvas{position:relative;display:block;width:100%;height:100%}input[type=range]{width:100%;margin:16px 0}output{font-variant-numeric:tabular-nums}.state{font-size:14px;color:#516873}.error{color:#a12424}a{color:#276a68}</style><main><h1>투구 모션 · 고정 비율 시안</h1><p>고정 3D 모델로 신체 비율을 유지하는 네 가지 투구폼. 각 폼 120개 자세를 2초 동안 재생합니다.</p><div class="controls"><select id="form" aria-label="투구폼"><option value="0">오버핸드</option><option value="1">쓰리쿼터</option><option value="2">사이드암</option><option value="3">언더핸드</option></select><select id="kit" aria-label="유니폼"></select><select id="hand" aria-label="투구 손"><option value="right">우투</option><option value="left">좌투</option></select><button class="primary" id="play">▶ 재생</button><button id="prev" aria-label="이전 프레임">◀</button><button id="next" aria-label="다음 프레임">▶</button></div><div class="stage"><canvas></canvas></div><input id="frame" type="range" min="0" max="119" step="1" value="0" aria-label="프레임"><output id="counter">1 / 120</output><p id="status" class="state">모델을 불러오는 중…</p><p class="state">사진 컷과 다른 3D 검토 시안입니다. 게임 본편에는 적용되지 않았습니다. <a href="./index.html">게임으로 돌아가기</a></p></main><script type="module" src="./broadcast-fixed-review.mjs"></script></html>
