</style></head><body><main><small>BASEBALL EMPIRE · 투구 동작 시안</small><h1>더 부드러운 투구 동작</h1><p>기존 선수 외형을 유지하고, 컷 사이의 움직임을 보간했습니다. 다리는 조금 길게, 마운드에서 타석까지는 더 깊게 보이도록 조정했습니다.</p><p id="rate">2초 · 120프레임 · 60fps 목표</p><div class="controls"><button id="previous" aria-label="이전 프레임">◀</button><button id="play" disabled>▶ 재생</button><button id="next" aria-label="다음 프레임">▶</button><select id="mode" aria-label="재생 비교"><option value="120">120프레임</option><option value="60">60컷 비교</option></select><select id="hand" aria-label="투구 손"><option value="right">우투</option><option value="left">좌투</option></select><label>속도<select id="speed"><option value=".25">0.25배</option><option value=".5">0.5배</option><option value="1" selected>1배</option></select></label><label><input id="background" type="checkbox" checked>경기장</label><input id="seek" aria-label="구분 동작" type="range" min="0" max="119" step="1" value="0"><output id="step">1 / 120</output></div><p id="status" role="status">동작을 불러오는 중…</p><div class="scene"><canvas id="smooth-canvas" aria-label="120프레임 투구 애니메이션"></canvas></div><p>우완은 투구판 왼쪽 끝에서 발을 모으고 시작합니다. 왼발을 들어 착지한 뒤 오른발이 자연스럽게 따라옵니다. 188cm 장신 체형을 목표로 비율을 조정한 시안입니다.</p><footer><a href="broadcast-sixty.html?v=20261107-sixty83">이전 60컷 시안</a><a href="index.html">게임으로 돌아가기</a></footer></main><script type="module" src="broadcast-smooth-player.mjs?v=20261107-smooth84"></script></body></html>
