<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb"><title>BASEBALL EMPIRE · 서버 하루 진행 미리보기</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#172c40;background:#f4f7fb;color-scheme:light}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 48px}main{max-width:560px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;margin:12px 0 5px}h2{font-size:18px;margin:0 0 16px}
small,.muted{color:#61758a}section{background:#fff;border:1px solid #e0e8f0;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 4px 16px #18354b09}
button,a.link{appearance:none;border:0;border-radius:11px;background:#1e516b;color:#fff;padding:12px 15px;font-size:15px;font-weight:650;text-decoration:none;cursor:pointer}
button:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:#f3f7fa;padding:14px 8px;border-radius:12px}.stats strong{display:block;font-size:22px}
dl{display:grid;grid-template-columns:100px 1fr;gap:10px 12px;margin:0}dt{color:#61758a}dd{margin:0;overflow-wrap:anywhere}
#error{color:#a12626;white-space:pre-wrap}#notice{font-size:14px;line-height:1.6}
</style></head><body><main>
<header><div><small>BASEBALL EMPIRE · 서버 하루 진행</small><h1>서버 하루 진행</h1></div><a class="link" href="./">게임으로</a></header>
<p class="muted">하루 진행 결과는 서버에 저장됩니다. 통신이 끊겨도 같은 진행 요청으로 다시 시도합니다.</p>
<section><button id="advance" type="button" disabled>하루 진행</button> <button id="refresh" type="button">서버 정보 새로고침</button><p id="notice" role="status">로그인 상태 확인 중…</p><p id="error" role="alert" hidden></p></section>
<section id="team" hidden><h2 id="teamName"></h2><p id="city" class="muted"></p><div class="stats"><div><strong id="wins">–</strong>승</div><div><strong id="losses">–</strong>패</div><div><strong id="draws">–</strong>무</div></div></section>
<section id="meta" hidden><h2>현재 저장 상태</h2><dl><dt>시즌</dt><dd id="year"></dd><dt>날짜 인덱스</dt><dd id="day"></dd><dt>팬 수</dt><dd id="fans"></dd><dt>구단 ID</dt><dd id="teamId"></dd><dt>저장 버전</dt><dd id="revision"></dd><dt>갱신 시각</dt><dd id="updated"></dd></dl></section>
</main><script type="module">
import {createServerDayClient} from './server-day-client.js';
const $=id=>document.getElementById(id);
const client=createServerDayClient({api:'https://baseball-empire-save.duckdns.org',getSession:()=>JSON.parse(localStorage.getItem('be-cloud-session-v1')||'null'),storage:sessionStorage});
let home=null,capability=null,busy=false;
const display=(id,value)=>{$(id).textContent=value==null?'정보 없음':String(value)};
function buttons(){
 $('refresh').disabled=busy;
 $('advance').disabled=busy||!home||!capability?.canAdvance;
 let pending=false;try{pending=client.hasPending()}catch{}
 $('advance').textContent=busy?'처리 중…':pending?'같은 진행 요청 재시도':'하루 진행';
}
function error(e){$('error').hidden=false;$('error').textContent=e.name==='AbortError'?'응답 확인 시간이 지났습니다. 같은 진행 요청으로 다시 시도해 주세요.':String(e.message||e)}
async function refresh(){
 busy=true;home=null;buttons();$('error').hidden=true;$('notice').textContent='서버 상태 확인 중…';
 try{
  const [status,data]=await Promise.all([client.status(),client.home()]);
  if(!Number.isSafeInteger(data.revision)||!Number.isSafeInteger(data.day)||data.team?.id!==data.teamId)throw Error('서버 홈 데이터 형식이 올바르지 않습니다.');
  if(status.revision!==data.revision)throw Error('조회 중 서버 상태가 변경됐습니다. 새로고침해 주세요.');
  capability=status;home=data;
  display('teamName',data.team.name);display('city',data.team.city);display('wins',data.team.wins);display('losses',data.team.losses);display('draws',data.team.draws);
  display('year',data.year+'년');display('day',data.day);display('fans',data.team.fans?.toLocaleString('ko-KR'));display('teamId',data.teamId);display('revision',data.revision);display('updated',data.updatedAt);
  $('team').hidden=false;$('meta').hidden=false;
  $('notice').textContent=status.canAdvance?'서버 상태를 확인했습니다.':status.enabled?'저장된 게임이 없습니다.':'서버 하루 진행 기능이 아직 활성화되지 않았습니다.';
 }catch(e){error(e);$('notice').textContent='조회하지 못했습니다. 새로고침해 주세요.'}
 finally{busy=false;buttons()}
}
$('advance').addEventListener('click',async()=>{
 if(busy||!home||!capability?.canAdvance)return;
 const revision=home.revision;busy=true;buttons();$('error').hidden=true;$('notice').textContent='서버에서 하루를 진행하고 있습니다…';
 try{await client.advance(revision);home=null;await refresh()}
 catch(e){if(e.status===409&&e.code==='revision conflict'){await refresh();error(e)}else{error(e);$('notice').textContent='진행 결과를 확인하지 못했습니다. 같은 요청으로 재시도할 수 있습니다.'}}
 finally{busy=false;buttons()}
});
$('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
