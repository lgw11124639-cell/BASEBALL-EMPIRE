<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef2f5"><title>BASEBALL EMPIRE · 서버 홈</title><link rel="stylesheet" href="./ui.css?v=20261101-empire-ui78"><style>body{background:#eef2f5;color:#183656;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main.wrap{max-width:1080px;margin:auto;padding:14px 14px 96px}.be-preview-header{display:flex;justify-content:space-between;align-items:center;gap:10px}.be-preview-header h1{margin:4px 0;font-size:22px}.be-preview-note{color:#6b8198;font-size:12px;margin:8px 0 14px}.be-season-progress,.be-summary-grid>div,.be-preview-card{background:#fff}.be-preview-card{border:1px solid #dbe5f0;border-radius:13px;padding:14px;margin-top:12px}.be-preview-card h2{font-size:17px;margin:0 0 12px}.be-preview-scroll{overflow-x:auto}.be-preview-table{width:100%;border-collapse:collapse;font-size:13px}.be-preview-table th,.be-preview-table td{padding:11px 5px;border-bottom:1px solid #e1e9f1;text-align:right;white-space:nowrap}.be-preview-table th:nth-child(2),.be-preview-table td:nth-child(2){text-align:left}.be-preview-table .mine{background:#edf4fc;font-weight:800}.be-preview-fixture{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid #e5edf5;font-size:13px}.be-preview-fixture strong{color:#173b60}.be-preview-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #dce5ee;padding:12px 4px max(12px,env(safe-area-inset-bottom));font-size:12px;font-weight:750}.be-preview-nav span{color:#8195aa}.be-preview-nav .active{color:#1b5c99}#error{color:#b42318;white-space:pre-wrap}.be-season-count{font-variant-numeric:tabular-nums}</style></head><body><main class="wrap"><header class="be-preview-header"><div><div class="section-kicker">BASEBALL EMPIRE · KPBL</div><h1>구단 홈</h1></div><a href="./" class="secondary" style="font-size:12px">기존 게임</a></header><p class="be-preview-note">기존 ui.css와 홈 카드 구조를 사용하는 서버 조회 전용 화면입니다. 전체 세이브 및 경기 엔진은 실행하지 않습니다.</p><section class="dashboard-section be-home-main"><div class="be-season-controls"><button id="refresh">서버 새로고침</button><button disabled title="서버 진행 API 미구현">하루 진행 · 준비 중</button></div><div class="be-season-progress"><strong id="season">시즌 불러오는 중…</strong><div class="be-season-count" id="date">서버 연결 중</div><div class="be-progress-track"><div id="progress" style="width:0%"></div></div><div class="be-summary-grid"><div><small>우리 구단</small><strong id="club">–</strong></div><div><small>현재 순위</small><strong id="rank">–</strong></div><div><small>관중·팬</small><strong id="fans">–</strong></div></div></div><p id="notice" class="be-season-count" role="status"></p><p id="error" hidden role="alert"></p></section><section class="dashboard-section be-preview-card"><div class="section-title"><div><span class="section-kicker">KPBL STANDINGS</span><h2>리그 순위</h2></div></div><div class="be-preview-scroll"><table class="be-preview-table"><thead><tr><th>순위</th><th>구단</th><th>승</th><th>패</th><th>무</th><th>승률</th></tr></thead><tbody id="standings"></tbody></table></div></section><section class="dashboard-section be-preview-card"><div class="section-title"><div><span class="section-kicker">KPBL SCHEDULE</span><h2>다가오는 경기</h2></div></div><div id="fixtures" class="be-calendar-upcoming"></div></section><div class="be-preview-note" id="revision"></div></main><nav class="be-preview-nav" aria-label="화면 미리보기"><span class="active">홈</span><span>선수단</span><span>뉴스</span><span>리그</span><span>FA</span><span>국가대표</span><span>역사</span></nav><script>(function(){'use strict';const $=id=>document.getElementById(id);const API='https://baseball-empire-save.duckdns.org/v2/view/home';const txt=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=String(value);if(cls)e.className=cls;return e};const format=n=>Number(n||0).toLocaleString('ko-KR');async function refresh(){const b=$('refresh');b.disabled=true;$('error').hidden=true;$('notice').textContent='서버에서 조회 중…';try{let session;try{session=JSON.parse(localStorage.getItem('be-cloud-session-v1')||'null')}catch{}if(!session||typeof session.token!=='string'||!session.token)throw Error('클라우드 로그인 정보가 없습니다. 기존 게임에서 로그인한 뒤 다시 열어 주세요.');if(Number(session.expiresAt)<=Date.now())throw Error('로그인 유효기간이 지났습니다. 기존 게임에서 다시 로그인해 주세요.');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);let res;try{res=await fetch(API,{headers:{Authorization:'Bearer '+session.token,Accept:'application/json'},cache:'no-store',signal:controller.signal})}finally{clearTimeout(timer)}if(!res.ok)throw Error('서버 홈 조회 실패 (HTTP '+res.status+')');const d=await res.json();if(!Number.isInteger(d.year)||!Number.isInteger(d.day)||!Array.isArray(d.standings)||!Array.isArray(d.fixtures)||d.team?.id!==d.teamId)throw Error('서버 홈 데이터 형식 오류');const names=new Map(d.standings.map(t=>[t.id,t.name]));$('season').textContent=d.year+' KPBL 시즌';const start=new Date(d.seasonStartDate+'T12:00:00');start.setDate(start.getDate()+d.day-1);$('date').textContent=start.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('progress').style.width=Math.min(100,Math.max(0,d.day/365*100))+'%';$('club').textContent=(d.team.city||'')+' '+d.team.name;$('rank').textContent=(d.standings.find(t=>t.id===d.teamId)?.rank??'–')+'위';$('fans').textContent=format(d.team.fans);$('standings').replaceChildren(...d.standings.map(t=>{const tr=document.createElement('tr');if(t.id===d.teamId)tr.className='mine';for(const v of [t.rank,t.name,t.wins,t.losses,t.draws,Number(t.pct||0).toFixed(3)])tr.appendChild(txt('td',v));return tr}));const box=$('fixtures');box.replaceChildren();for(const day of d.fixtures.slice(0,12)){const section=document.createElement('details');section.className='be-calendar-fold';if(day===d.fixtures[0])section.open=true;const summary=txt('summary',day.date+' · '+day.pairs.length+'경기');section.appendChild(summary);for(const p of day.pairs){const row=document.createElement('div');row.className='be-preview-fixture';row.append(txt('span',(names.get(p.away)||p.away)+' 원정'),txt('strong','VS'),txt('span',(names.get(p.home)||p.home)+' 홈'));section.appendChild(row)}box.appendChild(section)}$('revision').textContent='저장 버전 '+d.revision+' · 서버 읽기 전용';$('notice').textContent='서버 데이터 연결 완료 · 전체 세이브 미다운로드'}catch(e){$('error').hidden=false;$('error').textContent=e?.message||String(e);$('notice').textContent='조회 실패'}finally{b.disabled=false}}$('refresh').addEventListener('click',refresh);refresh()})();</script></body></html>
